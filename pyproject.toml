[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-plugin-massive"
version = "1.4.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Massive (massive.com) for Liminal: stocks, indices, currencies, crypto and futures on its API, with its headlines."
readme = "README.md"
requires-python = ">=3.10"
# the app it plugs into; which of its releases can load it is the plugin API the plugin declares
# (PLUGIN.api, checked when the app loads it), not this line
dependencies = ["liminal"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
massive = "liminal_plugin_massive"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
